spring.application.name=1clickapply
# Charge automatiquement le fichier .env à la racine du projet (format KEY=VALUE, sans guillemets)
spring.config.import=optional:file:.env[.properties]
# compose.yaml sert au déploiement Docker : ne pas le lancer automatiquement depuis IntelliJ
spring.docker.compose.enabled=false
# Base de données PostgreSQL (Localhost)

#spring.datasource.url=jdbc:postgresql://localhost:5432/oneclickapply_db
#spring.datasource.username=oneclick_user
#spring.datasource.password=oneclick_pass
spring.datasource.driver-class-name=org.postgresql.Driver
# Base de donnée Neon (https://neon.com/)
spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Configuration du serveur
server.port=8080
# Mode ligne de commande (pas de serveur web) : ./gradlew bootRun --args="--mode=source"
spring.main.web-application-type=none
spring.jpa.show-sql=false

# ===== Envoi Gmail (mot de passe d'application : https://myaccount.google.com/apppasswords) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Campagne =====
outreach.cities=Bremen,Hannover,Oldenburg,Osnabrück,Braunschweig,Göttingen,Wolfsburg,Hildesheim,Delmenhorst,Lüneburg,Celle,Salzgitter,Wilhelmshaven,Bremerhaven
outreach.min-score=2
outreach.daily-limit=40
outreach.min-delay-seconds=300
outreach.max-delay-seconds=600
outreach.follow-up-after-days=7
outreach.scrape-delay-millis=1000
outreach.cv-path=${CV_PATH:./CV_Claver.pdf}
outreach.review-csv-path=./data/review.csv
outreach.sender-name=Monthe Kameni Claveri
outreach.sender-email=${GMAIL_USER}
outreach.phone=+49 1590 6817021
outreach.portfolio-url=https://claver.vercel.app
outreach.github-url=https://github.com/clavermkc
